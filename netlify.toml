# Static site from the repo root + the stats functions in netlify/functions
[build]
  publish = "."

# The publish folder is the repo root, so keep the backend source and notes private
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

# TikTok verifies each URL (terms, privacy) as a prefix, so serve the signature file under any page
[[redirects]]
  from = "/:page/tiktokF5KHSLsnqbrxkuyOE7BQ8ajoo5PzOoCx.txt"
  to = "/tiktokF5KHSLsnqbrxkuyOE7BQ8ajoo5PzOoCx.txt"
  status = 200
  force = true
